name: Python CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 语法编译检查
        run: python -m compileall power_load_forecasting_V1
      - name: flake8 严重错误检查
        run: |
          pip install flake8
          flake8 power_load_forecasting_V1 --select=E9,F63,F7,F82 --show-source --statistics
